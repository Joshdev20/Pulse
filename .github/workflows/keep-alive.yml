# Keep the Render free-tier backend warm.
#
# The free instance sleeps after ~15 minutes idle, and the 30-60s wake-up makes
# media downloads time out — which shows up as broken images and videos that
# never play. Pinging well inside that window keeps the instance awake.
#
# This runs from GitHub rather than Render because a Render-side cron job would
# have to live on the same sleeping service, and an external scheduler is the
# point. This repository is public, so Actions minutes are not billed.
#
# GitHub does not honour a 5-minute cron on a free plan. Observed gaps between
# runs are 4-9 hours, which is far longer than the ~15 minute idle timeout, so a
# single ping per run left the instance asleep for most of the day and every
# visitor in between paid the 30-60s cold start. Each run therefore holds the
# ping for most of an hour, so the instance is never idle long enough to sleep
# even when the next scheduled run is hours away.
name: Keep API warm

on:
  schedule:
    # Every 5 minutes, comfortably inside the ~15 minute idle timeout. GitHub
    # may delay a scheduled run under load, which is why the run itself also
    # holds the instance warm (see PULSE_HOLD_SECONDS below).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# A run that overruns must not stack up behind the next one.
concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    # Long enough for the hold to span the gap between scheduled runs.
    timeout-minutes: 70
    env:
      # Override with a repository variable to point at a different deploy;
      # the fallback is the production API.
      PULSE_API_URL: ${{ vars.PULSE_API_URL || 'https://pulse-api-y16m.onrender.com' }}
      # Keep pinging for 55 minutes after the first success. Comfortably under
      # the job timeout, and longer than the observed gap between runs.
      PULSE_HOLD_SECONDS: "3300"
    steps:
      # The script is standard-library only, so the runner's python3 is enough.
      - uses: actions/checkout@v5
      - name: Ping the health endpoint
        run: python3 scripts/keep_alive.py
