# Render blueprint for the Pulse backend.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
#
# This file targets the FREE instance type. A free web service CANNOT attach a
# persistent disk (https://render.com/docs/free), so two things follow:
#
#   * Uploads land on the ephemeral filesystem and are lost on every redeploy.
#     Fine for a demo. To persist them, upgrade to a paid instance type and
#     uncomment the `disk` block at the bottom, then set UPLOAD_DIR.
#   * DATABASE_URL must point at an external Postgres. Render's own free
#     Postgres expires 30 days after creation, so a Neon or Supabase URL is a
#     better choice for anything you want to keep.

services:
  - type: web
    name: pulse-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      # Set these in the dashboard; `sync: false` keeps them out of git.
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTO_SEED
        value: "true"
    # Requires a paid instance type. Uncomment this AND change `plan` above,
    # then add UPLOAD_DIR=/data/uploads to envVars.
    # disk:
    #   name: pulse-uploads
    #   mountPath: /data
    #   sizeGB: 1
