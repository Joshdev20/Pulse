# Render blueprint for the Pulse backend.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
#
# This file targets the FREE instance type. A free web service CANNOT attach a
# persistent disk (https://render.com/docs/free), but that no longer costs us the
# uploads: the bytes are stored in the database row (`media.blob`) as well as on
# the local filesystem, so media survives a redeploy with the data. The disk
# block below is only needed if you want large files off the database.
#
# DATABASE_URL must point at an external Postgres. Render's own free Postgres
# expires 30 days after creation, so a Neon or Supabase URL is a better choice
# for anything you want to keep.

services:
  - type: web
    name: pulse-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      # Set these in the dashboard; `sync: false` keeps them out of git.
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTO_SEED
        value: "true"
      # Web Push. Without both keys the API reports push as unavailable and the
      # settings toggle stays off, so the app still runs. Generate a pair with
      # `python -m app.push` in backend/ and paste them here. Changing either key
      # invalidates every browser subscription already stored.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:no-reply@pulse.local"
    # Requires a paid instance type. Uncomment this AND change `plan` above,
    # then add UPLOAD_DIR=/data/uploads to envVars.
    # disk:
    #   name: pulse-uploads
    #   mountPath: /data
    #   sizeGB: 1
