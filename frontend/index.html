<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pulse — share short updates, follow people you care about." />
    <meta name="theme-color" content="#08090d" />

    <title>Pulse</title>

    <!-- Google Search Console. Verifies ownership of the whole origin (all
         paths), unlike a google<hash>.html file which only verifies its own
         path and would be swallowed by the SPA rewrite in vercel.json. -->
    <meta name="google-site-verification" content="AIXihU5yzyVMRQ05bx09VRK21x-BE3MYJWDHnC6Dfk8" />

    <!-- Icons. The SVG is first so browsers that understand it use the crisp
         vector; the .ico is the fallback for everything else, and the PNGs
         cover the sizes that want a raster. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Warm the API up while the bundle is still downloading.
         The API is a separate origin, so without this the first authenticated
         call pays DNS, TCP and TLS on top of whatever the host costs — and that
         call is what gates the first screen. %VITE_API_BASE% is substituted by
         Vite at build time, so a same-origin or local build gets a no-op
         instead of a request to production. The request itself opens the
         connection, so no separate preconnect is needed. -->
    <script>
      (function () {
        var base = '%VITE_API_BASE%'
        // An unsubstituted placeholder means the variable was not set for this
        // build, in which case the API is same-origin and needs no warm-up.
        if (!base || base.indexOf('%VITE_') === 0) return
        try {
          // Fire-and-forget: the backend is a free instance that sleeps when
          // idle and takes 30-60s to wake, so starting the wake now overlaps it
          // with the download instead of serialising it after React mounts.
          // `no-cors` is deliberate — the point is that the request reaches the
          // host and starts it booting, not that this code can read the reply.
          fetch(base.replace(/\/+$/, '') + '/api/health', {
            mode: 'no-cors',
            cache: 'no-store',
            credentials: 'omit',
          }).catch(function () {})
        } catch (error) {
          /* A failed warm-up must never affect the page. */
        }
      })()
    </script>

    <!-- Link previews. The image URL must be absolute: WhatsApp discards a
         relative og:image, the same reason the backend's per-profile cards
         build one from the public base. /api/preview/... serves a per-profile
         card for shared profile links; this static one is the default. -->
    <link rel="canonical" href="https://pulse-hazel-nine.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pulse" />
    <meta property="og:url" content="https://pulse-hazel-nine.vercel.app/" />
    <meta property="og:title" content="Pulse — short updates, real conversations" />
    <meta
      property="og:description"
      content="Share short updates, follow the people and topics you care about, and jump into real conversations."
    />
    <meta property="og:image" content="https://pulse-hazel-nine.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Pulse logo: a gradient tile with a heartbeat waveform." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pulse — short updates, real conversations" />
    <meta
      name="twitter:description"
      content="Share short updates, follow the people and topics you care about, and jump into real conversations."
    />
    <meta name="twitter:image" content="https://pulse-hazel-nine.vercel.app/og-image.png" />
    <script>
      // Set the theme before the first paint so the page never flashes the
      // wrong palette. Kept in sync by src/lib/useTheme.ts.
      (function () {
        try {
          var saved = localStorage.getItem('pulse.theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <style>
      /* The first-load screen, painted from the document itself.
         React cannot show the loader until the bundle has been fetched and
         parsed, which on a cold installed-PWA launch is the slowest part of the
         start. Painting the mark from inline CSS means the animation is visible
         from the first frame instead of after a blank screen. React renders the
         same markup on mount, so the swap is invisible. */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        /* Matches --bg and --text-muted from styles.css, in both themes, so the
           handover to React does not flash a different colour. */
        background: #08090d;
        color: #9aa3b8;
        z-index: 9999;
      }
      :root[data-theme='light'] .boot-splash {
        background: #f6f7fb;
        color: #5a6379;
      }
      .boot-splash svg {
        overflow: visible;
        width: 84px;
        height: 84px;
      }
      .boot-splash .boot-halo {
        fill: #b8f24a;
        opacity: 0;
        transform-origin: center;
        animation: boot-halo 1.9s ease-out infinite;
      }
      .boot-splash .boot-trace {
        stroke-dasharray: 32;
        animation: boot-trace 1.9s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .boot-splash .boot-tile {
        transform-origin: center;
        animation: boot-tile 1.9s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .boot-splash p {
        margin: 0;
        font: 600 15px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        letter-spacing: 0.02em;
        color: inherit;
      }
      @keyframes boot-trace {
        0% { stroke-dashoffset: 32; }
        42% { stroke-dashoffset: 0; }
        88%, 100% { stroke-dashoffset: 0; }
      }
      @keyframes boot-halo {
        0% { opacity: 0; transform: scale(1); }
        40% { opacity: 0.42; transform: scale(1.16); }
        80%, 100% { opacity: 0; transform: scale(1.3); }
      }
      @keyframes boot-tile {
        0%, 100% { transform: scale(1); }
        44% { transform: scale(1.05); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash .boot-halo,
        .boot-splash .boot-trace,
        .boot-splash .boot-tile {
          animation: none;
        }
        .boot-splash .boot-trace { stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Mirrors the React BrandLoader so the first frame is never blank. React
         replaces the whole subtree on mount; the markup is identical, so the
         handover is not visible. -->
    <div class="boot-splash" role="status" aria-label="Loading Pulse">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="bootFill" x1="0" y1="0" x2="0.86" y2="1">
            <stop offset="0" stop-color="#b8f24a" />
            <stop offset="0.55" stop-color="#8ce08f" />
            <stop offset="1" stop-color="#60a5fa" />
          </linearGradient>
        </defs>
        <rect class="boot-halo" width="24" height="24" rx="7" />
        <rect class="boot-tile" width="24" height="24" rx="7" fill="url(#bootFill)" />
        <g class="boot-trace" fill="none" stroke="#10160a" stroke-width="2.8"
           stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.6 12h4.4l1.6-4.8 2.2 9.6 1.6-4.8h7" />
        </g>
      </svg>
      <p>Loading Pulse…</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
