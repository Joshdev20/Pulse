<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pulse — share short updates, follow people you care about." />
    <meta name="theme-color" content="#08090d" />

    <title>Pulse</title>

    <!-- Icons. The SVG is first so browsers that understand it use the crisp
         vector; the .ico is the fallback for everything else, and the PNGs
         cover the sizes that want a raster. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Link previews. The image URL must be absolute: WhatsApp discards a
         relative og:image, the same reason the backend's per-profile cards
         build one from the public base. /api/preview/... serves a per-profile
         card for shared profile links; this static one is the default. -->
    <link rel="canonical" href="https://pulse-hazel-nine.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pulse" />
    <meta property="og:url" content="https://pulse-hazel-nine.vercel.app/" />
    <meta property="og:title" content="Pulse — short updates, real conversations" />
    <meta
      property="og:description"
      content="Share short updates, follow the people and topics you care about, and jump into real conversations."
    />
    <meta property="og:image" content="https://pulse-hazel-nine.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Pulse logo: a gradient tile with a heartbeat waveform." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pulse — short updates, real conversations" />
    <meta
      name="twitter:description"
      content="Share short updates, follow the people and topics you care about, and jump into real conversations."
    />
    <meta name="twitter:image" content="https://pulse-hazel-nine.vercel.app/og-image.png" />
    <script>
      // Set the theme before the first paint so the page never flashes the
      // wrong palette. Kept in sync by src/lib/useTheme.ts.
      (function () {
        try {
          var saved = localStorage.getItem('pulse.theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
